services:
  booking-db:
    image: postgres:16.1
    container_name: postgres_book
    ports:
      - "5435:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=bookdb
      - POSTGRES_USER=book
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U book -d bookdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
